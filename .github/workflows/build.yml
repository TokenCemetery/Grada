name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md' ]
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_call:

# A newer push to the same branch or PR makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The project uses the Xcode 27 format (project.xcproj), which Xcode 26 cannot read
    runs-on: xcode-27

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.2.app

      # Pick whichever iPhone simulator the runner image provides
      - name: Select simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available iPhone -j \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "id=$id" >> "$GITHUB_OUTPUT"
          # Cold boot takes minutes; overlap it with the build
          xcrun simctl boot "$id" > /dev/null 2>&1 &

      # Unsigned build and unit tests (UI tests are skipped)
      - name: Build and test
        run: |
          xcodebuild test \
            -project Grada.xcodeproj \
            -scheme Grada \
            -destination "id=${{ steps.simulator.outputs.id }}" \
            -only-testing:GradaTests \
            CODE_SIGNING_ALLOWED=NO
